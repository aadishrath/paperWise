[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperwise-api"
version = "0.1.0"
description = "Local-first document question answering API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "celery[redis]>=5.4,<6.0",
  "httpx>=0.27,<1.0",
  "opentelemetry-api>=1.30,<2.0",
  "opentelemetry-sdk>=1.30,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.51b0,<1.0",
  "opentelemetry-instrumentation-httpx>=0.51b0,<1.0",
  "PyMuPDF>=1.24,<2.0",
  "python-docx>=1.1,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-multipart>=0.0.12,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<7.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
